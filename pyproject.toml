[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-groot"
version = "0.1.0"
description = "Minimal GR00T N1, N1.5, N1.6 and N1.7 fine-tuning package"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "ATTRIBUTIONS.md"]

dependencies = [
    "accelerate==1.13.0",
    "albumentations==1.4.18",
    "av>=14,<17",
    "decord==0.6.0; platform_machine == 'x86_64'",
    "einops>=0.8",
    "lmdb>=1.7",
    "peft>=0.17,<0.19",
    "timm>=1.0,<1.1",
    "diffusers==0.35.1",
    "dm-tree",
    "huggingface-hub[cli]",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "opencv-python-headless>=4.5,<4.13",
    "pandas==2.2.3",
    "pillow>=10",
    "pyarrow==21.0.0",
    "pyyaml>=6",
    "scipy==1.15.3",
    "torch==2.9.0",
    "torchcodec==0.8.0; platform_machine == 'x86_64'",
    "torchvision==0.24.0",
    "tqdm>=4.66",
    "transformers==4.57.3",
    "tyro==0.9.17",
    # experiment.py imports wandb at module import time even when logging is disabled.
    "wandb==0.23.0",
]

[project.optional-dependencies]
eval = [
    "gymnasium==1.2.2",
    "matplotlib==3.10.1",
    "msgpack==1.1.0",
    "msgpack-numpy==0.4.8",
    "pyzmq==27.0.1",
    "websockets>=14,<16",
    "imageio[ffmpeg]>=2.34",
]
distributed = [
    "deepspeed==0.17.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
performance = [
    "flash-attn==2.8.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["build", "ipykernel", "ipywidgets", "pre-commit", "pytest", "pytest-timeout", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gr00t*"]
namespaces = true

[tool.setuptools.package-data]
"gr00t.configs" = ["deepspeed/*.json"]
"gr00t.model.gr00t_n1" = [
    "backbone/eagle2_hg_model/*.json",
    "backbone/eagle2_hg_model/*.txt",
]
"gr00t.model.gr00t_n1d5" = [
    "backbone/eagle2_hg_model/*.json",
    "backbone/eagle2_hg_model/*.txt",
]
"gr00t.model.gr00t_n1d6" = [
    "modules/nvidia/Eagle-Block2A-2B-v2/*.json",
    "modules/nvidia/Eagle-Block2A-2B-v2/*.txt",
]
"gr00t.eval.sim.LIBERO" = ["*.sh"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
flash-attn = [
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.9.0", "numpy==1.26.4"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
